<div>
  <form  [formGroup]="contactForm" class="w-3/4 max-w-[600px] border-1 p-3 mx-auto bg-gray-100 rounded-xl">
    <div>
      <h5 [ngClass]="{
        'text-center mb-3':true,
        'bg-red-100 ':has_error,
        'invisible':!has_error,
      }">{{has_error ? error_message: "no error"}}</h5>
      <!-- TIL that this is simpler for conditional -->
    </div>
    <div class="grid grid-cols-2 gap-3">
      <input  class="md:col-span-1 col-span-2 border-1 px-3 py-2.5 text-sm" type="text" [placeholder]="placeHolderValues.fullName" formControlName="fullName"/>
      <input  class="md:col-span-1 col-span-2 border-1 px-3 py-2.5 text-sm" type="text" [placeholder]="placeHolderValues.email" formControlName="email"/>
      <select
        id="options"
        class="col-span-2 block w-full px-3 py-2.5 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand shadow-xs"
        formControlName="Subject"
      
      >
        <option selected [value]="subjectOption[0].value">{{ subjectOption[0].text }}</option>

        @for (item of subjectOption.slice(1); track $index) {
          <option  [value]="item.value">{{ item.text }}</option>
        }
      </select>
      @if (false) {
        <input class="col-span-2 border-1 px-3 py-2.5" type="text" [placeholder]="placeHolderValues.Other" formControlName="Other" />
      }
      <textarea rows="4" class="resize-none  w-full col-span-2 border-1 px-3 py-2.5" [placeholder]="placeHolderValues.message[0]" formControlName="message" ></textarea>
      <button class="col-span-2 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" (click)="onSubmit()" type="button">
        Submit
      </button>
    </div>
  </form>
</div>
