<div id="card" class="relative flex flex-row w-3/4 rounded-xl border-2">
    <img [src]="info().imgURL" [alt]="info().altIMG" class="w-[50%] border-3 border-red-100"/>
    <div id="word" class="flex flex-col pl-5 w-[50%]">
        <h3 class="text-center w-[100%]">{{info().title}}</h3>
        <body>{{info().desc}}</body>
        <div id="tech_part" class="flex flex-row gap-1">
            @for (item of info().techUsed; track $index) {
                {{item.title}}
            }
        </div>
    </div>
</div>
<h1>Hello card</h1>
