
<div class="flex flex-row max-w-[385px]  h-auto md:h-30 rounded-xl border-1" [ngClass]="{'bg-gray-100':isHovered, 'bg-white':!isHovered}" (mouseenter)="onHover(true)" (mouseleave)="onHover(false)">
    <div class="w-1/4 my-auto p-2">
        <img src="{{info().logo}}" alt="{{info().title}} icon" class="w-[100%]" />
    </div>
    <div class="flex flex-col w-3/4 sm:p-2 p-0 ">
        <h2 class="text-lg font-semibold m-1">{{info().title}}</h2>
        <p class="text-md">{{info().description}}</p>
    </div>
    

</div>
