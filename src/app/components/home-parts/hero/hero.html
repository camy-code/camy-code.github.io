<div class=" pb-30 pt-25" id="hero-section">
    <!-- Can change colour here -->
  <div class="flex md:flex-row flex-col justify-center p-6 md:w-3/4 sm:w-1/1 mx-auto gap-1">
    <div class="flex flex-col gap-0">
      <h3 class="">{{ info().greeting }}</h3>
      <h2>{{ info().title }}</h2>
      <p>{{ info().spiel }}</p>
      <div class="mt-4">
        <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" href="#contact-section">Contact me!</button>
      </div>
      <div class="flex flex-row gap-4 md:mx-0 mx-auto mt-2">
        @for (item of icons; track $index) {
          <div>
            @if (item.name == 'git') {
              <div class="w-15 h-15 text-black hover:text-orange-500">
              <a href="https://github.com/camy-code" target="_blank">
               <app-github-logo/>
              </a>
              </div>
              
            } @else if (item.name == 'email') {
              <div class="w-15 h-15 text-black hover:text-blue-500">
              <a href="" >
                <app-email-logo/>
              </a>
              </div>
            }
          </div>
        }
      
      </div>
    </div>
    <img [src]="info().imgURL" [alt]="info().altIMG" class="h-auto w-50 rounded-xl mx-auto" />
  </div>
</div>
