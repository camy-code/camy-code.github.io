<div class=" pb-30" id="hero-section">
    <!-- Can change colour here -->
  <div class="flex flex-row justify-center p-6 md:w-3/4 sm:w-1/1 mx-auto gap-1">
    <div class="flex flex-col gap-0">
      <h3 class="">{{ info().greeting }}</h3>
      <h2>{{ info().title }}</h2>
      <p>{{ info().spiel }}</p>
      <div>
        <button>Contact</button>
      </div>
      <div class="flex flex-row gap-2">
        @for (item of icons; track $index) {
          <div>{{ item.name }}</div>
        }
      </div>
    </div>
    <img [src]="info().imgURL" [alt]="info().altIMG" class="h-auto w-50 rounded-xl" />
  </div>
</div>
